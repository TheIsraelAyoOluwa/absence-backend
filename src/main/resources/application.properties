spring.application.name=absence-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/absencedb
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui

app.security.token-secret=${JWT_SECRET:absence-backend-dev-secret-change-me}
app.security.token-expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# Enable spring security debug for troubleshooting (remove in production)
logging.level.org.springframework.security=DEBUG

